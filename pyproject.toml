[project]
name = "market"
version = "0.1.0"
description = "A historical trading simulator: a bot trades real daily S&P 500 data one simulated day at a time, without seeing the future."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "typer>=0.27.2",
]

[project.scripts]
market = "market.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "DTZ", # naive datetimes (determinism)
]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
